<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link rel="stylesheet" href="./asset/css/reset.css" />
        <link rel="stylesheet" href="./asset/css/style.css" />
    </head>
    <body class="register-body">
        <div class="container">
            <div class="register-section">
                <div class="img-register">
                    <img src="./asset/img/6f04ec46100bd23d153ee1ff00a28f8f.jpg" alt="" />
                </div>
                <div class="register-form">
                    <h1>Register to Christmas Event</h1>

                    <p>Lorem ipsum dolor sit amet elit. Sapiente sit aut eos consectetur adipisicing.</p>
                    <form>
                        <div class="form-body">
                            <div class="from-group">
                                <label for="first-name">First Name</label>
                                <input type="text" id="first-name" placeholder="e.g. John" />
                            </div>

                            <div class="from-group">
                                <label for="last-name">Last Name</label>
                                <input type="text" id="last-name" placeholder="e.g. Smith" />
                            </div>

                            <div class="from-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="e.g. john@your-domain.com" />
                            </div>

                            <div class="from-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" placeholder="+00 000 000 0000" />
                            </div>

                            <div class="from-group">
                                <label for="website">Website</label>
                                <input type="url" id="website" placeholder="e.g. https://google.com" />
                            </div>

                            <div class="from-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" placeholder="Your Password" />
                            </div>

                            <div class="from-group">
                                <label for="confirm-password">Re-type Password</label>
                                <input type="password" id="confirm-password" placeholder="Your Password" />
                            </div>

                            <div class="checkbox">
                                <input type="checkbox" id="terms" />

                                <label for="terms">
                                    Register means you're okay with our
                                    <a href="#">Terms and Conditions</a>
                                    and our
                                    <a href="#">Privacy Policy</a>
                                    .
                                </label>
                            </div>
                            <div class="btn-register" type="submit">Register</div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
